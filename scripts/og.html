<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    .og {
      width: 1200px; height: 630px; background: #faf9f6; color: #1a1814;
      font-family: "Source Serif 4", Georgia, serif; position: relative;
      -webkit-font-smoothing: antialiased;
    }
    .copy { position: absolute; left: 80px; right: 80px; top: 160px; }
    .kicker { letter-spacing: 0.16em; text-transform: uppercase; color: #6f6a63; font-size: 18px; font-weight: 600; margin: 0 0 22px; font-family: Inter, sans-serif; }
    h1 { font-size: 68px; line-height: 1.08; letter-spacing: -0.03em; margin: 0 0 24px; font-weight: 600; }
    p { font-size: 26px; color: #6f6a63; margin: 0; }
    .url { position: absolute; left: 80px; bottom: 56px; color: #6f6a63; font-size: 20px; letter-spacing: 0.02em; font-family: Inter, sans-serif; }
  </style>
</head>
<body>
  <div class="og" id="og">
    <div class="copy">
      <p class="kicker">Chris Cameron-Hann</p>
      <h1>Writing on models, software, and the work.</h1>
      <p>Personal site. Not a company blog.</p>
    </div>
    <div class="url">cameronhann.com</div>
  </div>
</body>
</html>
