<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    .og {
      width: 1200px; height: 630px; background: #17264F; color: #fff;
      font-family: Outfit, sans-serif; position: relative;
      -webkit-font-smoothing: antialiased;
    }
    .bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #70F1A9; }
    .copy { position: absolute; left: 80px; right: 80px; top: 150px; }
    .kicker { letter-spacing: 0.16em; text-transform: uppercase; color: #70F1A9; font-size: 22px; font-weight: 500; margin: 0 0 28px; }
    h1 { font-size: 72px; line-height: 1.05; letter-spacing: -0.03em; margin: 0 0 28px; font-weight: 700; }
    p { font-size: 28px; color: rgba(255,255,255,0.72); margin: 0; font-weight: 500; }
    .url { position: absolute; left: 80px; bottom: 56px; color: rgba(255,255,255,0.55); font-size: 22px; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="og" id="og">
    <div class="bar"></div>
    <div class="copy">
      <p class="kicker">CTO · Aegaea · 7Analytics</p>
      <h1>I build models, software, and teams.</h1>
      <p>Flood risk, insurance, hydrology.</p>
    </div>
    <div class="url">cameronhann.com</div>
  </div>
</body>
</html>
